name: Smoke Tests

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC daily (no timezone was specified; adjust as needed, GitHub cron is UTC and has no DST)
  workflow_dispatch:
    inputs:
      test_grep:
        description: 'Blank = run all | One test: TC0001 | Several: TC0001|TC0002 | By partial title'
        required: false
        default: ''

jobs:
  smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: run
        continue-on-error: true
        run: |
          rm -rf allure-results
          npx playwright test --project=chromium tests/smoke-tests --grep "${TEST_GREP:-.*}"
        env:
          TEST_GREP: ${{ github.event.inputs.test_grep }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          ENV: ci
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-playwright-report, path: playwright-report/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-allure-report, path: allure-report/, retention-days: 14 }
      - if: steps.run.outcome == 'failure'
        run: exit 1
